name: Environment Demo

on:
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Show Development Variable
        run: echo "Deploying ${{ vars.APP_NAME }}"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Show Production Variable
        run: echo "Deploying ${{ vars.APP_NAME }}"
